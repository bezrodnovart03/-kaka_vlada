# nginx в одном контейнере с Django (deploy/render). __PORT__ подставляет start.sh.
# Работает от непривилегированного пользователя: pid и временные файлы — в /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream django {
        server 127.0.0.1:8000;
    }

    server {
        listen __PORT__;
        root /app/frontend;

        # Чек к оплате до ATTACHMENT_MAX_MB плюс запас на multipart.
        client_max_body_size 12m;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/calendar;
        gzip_min_length 1024;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        # Health check Render и внешний пинг (чтобы бесплатный сервис не засыпал).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # HTTPS снаружи завершает прокси Render; X-Forwarded-Proto передаём от него.
        location ~ ^/(api|admin)/ {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }

        location /static/ {
            alias /app/backend/staticfiles/;
            expires 7d;
        }

        # add_header внутри location отменяет заголовки уровня server — повторяем их.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri /index.html;
        }
    }
}
