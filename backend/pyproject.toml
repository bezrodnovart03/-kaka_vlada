[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise>=2.0.1",
    "django>=6.0,<6.1",
    "django-ninja>=1.7.1",
    "django-ninja-jwt>=5.4.5",
    "django-simple-history>=3.13.0",
    "django-stubs-ext>=6.1.2",
    "django-unfold>=0.110.0",
    "filetype>=1.2.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
    "schemathesis>=4.32.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
# У django-simple-history нет py.typed и stubs.
module = ["simple_history.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# У django-unfold тоже нет py.typed; @display из unfold.decorators не типизирован.
module = ["unfold.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.*.admin"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
